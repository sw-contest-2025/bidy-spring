plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bidy'
version = '0.0.1-SNAPSHOT'
description = 'Auction platform for a software contest'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    // WebSocket 설정
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
    //타임리프
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    //Validation 의존성
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    //암호화
    implementation 'org.springframework.security:spring-security-crypto'
    //이메일 전송
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    //.env자동으로 읽게
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	/* jsp 설정
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	// jstl 설정
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	 */
    compileOnly 'org.projectlombok:lombok'
    // H2
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
    //providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // Mokiko
    testImplementation 'org.mockito:mockito-core:5.11.0'

    // PDF 생성
    implementation 'com.itextpdf:kernel:7.2.6'
    implementation 'com.itextpdf:layout:7.2.6'
}

tasks.named('test') {
	useJUnitPlatform()
}
tasks.withType(Test) {
    jvmArgs += "-javaagent:${classpath.find { it.name.contains("mockito-core") }.absolutePath}"
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}