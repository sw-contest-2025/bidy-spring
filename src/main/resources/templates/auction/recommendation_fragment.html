<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="recommendations" class="recommendations-section">
    <h2>추천 경매 3개 (관련 태그 기반)</h2>
    <div class="recommendation-cards">

        <a th:each="recProduct : ${recommendedProducts}"
           th:href="@{|/auction/auction_detail?productId=${recProduct.productId}|}"
           class="rec-card">

            <div class="rec-image-container">
                <img th:src="${recProduct.imageUrl ?: 'https://placehold.co/300x200/f0f0f0/333?text=상품 이미지'}" alt="추천 이미지"
                     onerror="this.onerror=null; this.src='https://placehold.co/300x200/f0f0f0/333?text=상품 이미지';">
            </div>

            <div class="rec-details">
                <div class="rec-title" th:text="${recProduct.postName}">추천 상품명</div>
                <div class="rec-price" th:text="${#numbers.formatInteger(recProduct.currentPrice, 0, 'COMMA')} + '원'">100,000원</div>

                <div class="rec-time">남은 시간: [타이머 자리]</div>
            </div>
        </a>

        <div th:if="${#lists.isEmpty(recommendedProducts)}" class="rec-card" style="grid-column: span 3; text-align: center;">
            추천 상품을 불러올 수 없습니다.
        </div>
    </div>
</section>
