<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="content="width=device-width, initial-scale=1.0"">
    <title th:text="|경매 - ${product.postName}|">경매 상세 페이지</title>

    <!-- CSS 파일 로드 -->
    <link rel="stylesheet" th:href="@{/css/auction_detail_styles.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        .auction-header-wrapper {
            max-width: 1200px; !important;
            margin: 0 auto; !important;
           }
        .bid-status-box-section, .recommendations-section, .description-section {
            padding: 0 30px;
            margin-bottom: 40px;
        }
        .description-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>


<div class="auction-header-wrapper" th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:if="${message}" class="alert alert-success" style="padding: 10px; background: #e6ffe6; color: green; text-align: center;">
        <span th:text="${message}"></span>
    </div>

    <!-- 상품 요약 및 입찰 폼-->
    <h1 class="product-title" th:text="${product.postName}">경매 상품명</h1>
    <div th:insert="auction/summary_fragment :: productSummary"></div>

    <div style="clear: both;"></div>

    <!-- 상세 설명  -->
    <div th:insert="auction/description_fragment :: descriptionDetail"></div>

    <!-- 추천 경매 -->
    <div th:insert="auction/recommendation_fragment :: recommendations"></div>

</div>

<!-- JavaScript 파일 로드 및 실행 -->
<script th:src="@{/js/timer.js}"></script>
<script th:src="@{/js/wishlist.js}"></script>

<script th:inline="javascript">
    // 타이머용 문자열
    const serverEndTimeStr = /*[[${endTime}]]*/ '2025-11-15T10:00:00+0900';
    const currentProductId = /*[[${product.productId}]]*/ 1;
    const currentMemberId = /*[[${currentMemberId}]]*/ null;

    // 타이머 시작
    startAuctionFeatures(serverEndTimeStr, currentProductId);

    // 위시리스트 토글 기능 초기화
    initializeWishlistToggle(currentMemberId, currentProductId);
</script>
</body>
</html>
