<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="content="width=device-width, initial-scale=1.0"">
    <title th:text="|경매 - ${product.postName}|">경매 상세 페이지</title>

    <!-- CSS 파일 로드 -->
    <link rel="stylesheet" th:href="@{/css/auction_detail_styles.css}">

    <style>
        .main-header, .main-footer {
            padding: 15px 30px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .bid-status-box-section, .recommendations-section, .description-section {
            padding: 0 30px;
            margin-bottom: 40px;
        }
        .description-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<!-- 헤더 Fragment 호출
<div th:replace="fragments/layout_header :: header"></div> -->

<div class="container">

    <!-- 상품 요약 및 입찰 폼-->
    <div th:insert="auction/summary_fragment :: productSummary"></div>

    <div style="clear: both;"></div>

    <!-- 상세 설명  -->
    <div th:insert="auction/description_fragment :: descriptionDetail"></div>

    <!-- 추천 경매 -->
    <div th:insert="auction/recommendation_fragment :: recommendations"></div>

</div>

<!-- JavaScript 파일 로드 및 실행 -->
<script th:src="@{/js/timer.js}"></script>

<script th:inline="javascript">
    const serverEndTimeStr = /*[[${endTime}]]*/ '2025-11-15T10:00:00+0900';
    const currentProductId = /*[[${product.productId}]]*/ 1;

    startAuctionFeatures(serverEndTimeStr, currentProductId);
</script>
</body>
</html>
