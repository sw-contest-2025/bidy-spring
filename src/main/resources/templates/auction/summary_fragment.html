<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="productSummary" class="product-summary">

    <div class="summary-left">
        <div class="product-image">
            <img th:src="${product.imageUrl ?: '[https://placehold.co/600x450/fdd855/000?text=NO+IMAGE](https://placehold.co/600x450/fdd855/000?text=NO+IMAGE)'}" alt="상품 이미지">
        </div>

        <div class="product-actions">
            <button th:if="${product.user.memberId  != loginId}"
                    class="action-buttons chat-btn"
                    th:onclick="|location.href='@{/chat/{productId}(productId=${product.productId})}'|">
                채팅
            </button>
            <div>
                <span th:text="|조회수: ${product.views} |">조회수: 0</span>
            <!--찜 버튼 -->
                <button class="action-buttons interest-btn"
                        id="interest-btn"
                        th:attr="data-product-id=${product.productId}, data-member-id=${loginMember != null ? loginMember.memberId : 0}">
                    <img th:src="@{/images/heart.png}" alt="찜" width="24" height="24" data-state="off">
                </button>
            </div>
        </div>
    </div>

    <div class="summary-right">
        <div class="status"
             th:text="${product.calculateEndTime().isBefore(#temporals.createNow()) ? '상태: 경매 종료' : '상태: 경매 진행중'}">
            상태: 경매 진행중
        </div>

        <div class="timer-box">
            <p>마감까지 남은 시간:</p>
            <span id="countdown-timer">시간 계산 중...</span>
        </div>

        <div class="bid-form-wrapper">
            <div class="price-info">
                <p>현재가:</p>
                <strong id="current-price-display" th:text="${#numbers.formatInteger(product.currentPrice, 0, 'COMMA')} + '원'">50,000원</strong>
            </div>

            <!-- 입찰 폼 -->
            <form id="bidForm" th:action="@{/auction/bid}" method="post" onsubmit="return validateBidForm()">
                <div class="input-group">
                    <input type="number"
                           id="bidAmount"
                           name="bidPrice"
                           required
                           th:min="${product.currentPrice + 100}"
                           th:placeholder="|제시 가격: ${#numbers.formatInteger(product.currentPrice + 100, 0, 'COMMA')}원 이상|"
                           step="100">
                </div>

                <input type="hidden" name="productId" th:value="${product.productId}">

                <input type="hidden"
                       id="bidderIdHidden"
                       name="bidderId"
                       th:value="${loginMember != null ? loginMember.memberId : null}">


                <script>
                    function validateBidForm() {
                    const bidderId = document.getElementById('bidderIdHidden').value;

                    if (bidderId === 'null' || bidderId === '') {
                        alert('로그인이 필요합니다.');
                        window.location.href = '/login';
                        return false; // 폼 제출을 막습니다.
                    }
                    return true;
                }
                </script>

                <button id="bidButton"
                        class="bid-button"
                        th:disabled="${product.calculateEndTime().isBefore(#temporals.createNow())}"
                        type="submit"> <span th:text="${product.calculateEndTime().isBefore(#temporals.createNow()) ? '경매 종료 (입찰 불가)' : '입찰 버튼'}">입찰 버튼</span>
                </button>
            </form>
        </div>
        </div>
    </div>
</div>
