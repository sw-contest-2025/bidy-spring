<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>마이페이지</title></head>
<body>
<h2>마이페이지</h2>
<div>
    <p>이메일: <span th:text="${me.memberEmail}"></span></p>
    <p>이름: <span th:text="${me.memberName}"></span></p>
    <p>닉네임: <span th:text="${me.memberNickname}"></span></p>
    <p>생년월일: <span th:text="${me.memberBirthday}"></span></p>
    <p>권한: <span th:text="${me.memberRole}"></span></p>
</div>
<a th:href="@{/mypage/edit}">프로필 수정</a>
<a th:href="@{/logout}">로그아웃</a>
</body>
</html>
