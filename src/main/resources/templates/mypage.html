<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <style>
        :root{
            --brand:#e6891e;
            --text:#333;
            --muted:#888;
            --line:#e8e8e8;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,Arial;
            background:#fff;
            color:var(--text);
        }
        .wrap{ max-width:1100px; margin:0 auto; padding:24px; }

        /* 레이아웃 */
        .layout{
            display:grid;
            grid-template-columns: 280px 1fr;
            gap:0;
            min-height:100vh;
        }

        /* 사이드바 */
        .sidebar{
            position:sticky; top:16px;
            align-self:start;
            padding:24px 20px 24px 0;
            border-right:1px solid var(--line);
        }
        .profile{
            display:flex; flex-direction:column; align-items:center; gap:10px;
            padding-bottom:13px; border-bottom:1px solid var(--line);
            text-align:center;
        }
        .profile-img{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
            border: 1px solid var(--line);
            background: #f0f0f0;
        }
        .nick{font-weight:700; padding-bottom:0px;}
        .email{font-size:12px; color:var(--muted);}

        .stats{
            padding:14px 0; border-bottom:1px solid var(--line);
            text-align:center; /* 가운데 정렬 */
        }
        .num{font-size:22px; font-weight:800; color:var(--brand);}
        .label{font-size:13px; color:var(--muted);}

        .menu{
           /* width: fit-content;*/

            margin: 14px auto 0;

            list-style:none;
            padding:30px 0 0 80px;
            display:flex;
            flex-direction:column;
            gap:30px;
        }
        .menu li::before{
            content:"• ";
            color:var(--muted);
            font-weight:600;
            margin-right:4px;
        }
        .menu a{
            display:inline-block;
            text-decoration:none;
            color:var(--text);
        }
        .menu a.active{ color:var(--brand); font-weight:700; }
        .menu a:hover{ }

        /* 본문 */
        .content{
            padding:24px 0 24px 24px;
        }
        .content h2{ margin:0 0 10px; }
        .sub{color:var(--muted); font-size:14px; margin-bottom:16px}

    </style>
    <!--상품 그리드 css-->
    <link rel="stylesheet" th:href="@{/css/mypage_product_grid.css}">
<!--헤더 css-->
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- 헤더 포함 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="wrap">
    <div class="layout">

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="profile">
                <img class="profile-img" th:src="${member.profileImageUrl} ?: @{/images/profile_temp.png}">
                <div class="nick" th:text="${member.memberNickname} ?: ${member.memberName}">닉네임</div>
                <div class="email" th:text="${member.memberEmail}">email</div>
            </div>

            <div class="stats">
                <div class="num" th:text="${tradeCount}">0</div>
                <div class="label">거래횟수</div>
            </div>
            <ul class="menu">
                <li><a th:href="@{/mypage}" th:classappend="${activeTab}=='sales' ? ' active'">판매내역</a></li>
                <li><a th:href="@{/mypage/purchases}" th:classappend="${activeTab}=='purchases' ? ' active'">구매내역</a></li>
                <li><a th:href="@{/mypage/wishlist}" th:classappend="${activeTab}=='wishlist' ? ' active'">관심목록</a></li>
                <li><a th:href="@{/mypage/edit}" th:classappend="${activeTab}=='edit' ? ' active'">계정설정</a></li>
            </ul>
        </aside>

        <!-- 본문 -->
        <main class="content">
            <h2>판매내역</h2>
            <div class="sub">내가 등록한 상품 리스트</div>
            <div class="grid-wrapper">

                <div class="grid" th:if="${sales != null}">
                    <div class="card" th:each="s : ${sales}">
                        <div class="thumb-wrapper">
                            <img class="thumb"
                                 th:src="${p.imageUrl} ?: @{/images/product_null.png}"
                                 alt="상품 이미지">

                        </div>

                        <div class="card-body">
                            <p class="title" th:text="${s.postName}">상품명</p>
                            <span class="price"
                                  th:text="${#numbers.formatInteger(s.currentPrice, 3, 'COMMA')} + '원'">0원</span>

                            <!-- 타이머 + 상태 한 줄 배치 -->
                            <div class="meta-timer">
                                <div class="timer" th:attr="id='timer-' + ${s.productId}"
                                     th:data-days="${s.durationDays}"
                                     th:data-hours="${s.durationHours}"
                                     th:data-minutes="${s.durationMinutes}">00:00:00</div>
                                <span class="status"
                                      th:text="${s.calculateEndTime() != null and s.calculateEndTime().isBefore(T(java.time.LocalDateTime).now()) ? '판매완료' : '판매중'}">
                                    상태
                                </span>
                            </div>
                        </div>
                    </div>

                </div>
                <div th:if="${sales == null or #lists.isEmpty(sales)}"
                     style="grid-column:1/-1; color:var(--muted); text-align:center; padding:24px 0;">
                    아직 판매내역이 없습니다.
                </div>
            </div>


            <!-- JS 파일 로드 -->
            <script th:src="@{/js/timer.js}"></script>
            <script th:src="@{/js/wishlist.js}"></script>

            <!--타이머 기능 구현-->
            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    document.querySelectorAll('.timer').forEach(timerEl => {
                        const days = parseInt(timerEl.dataset.days);
                        const hours = parseInt(timerEl.dataset.hours);
                        const minutes = parseInt(timerEl.dataset.minutes);

                        const now = new Date().getTime();
                        const durationMs = (days*24*60*60*1000) + (hours*60*60*1000) + (minutes*60*1000);
                        const endTime = now + durationMs;

                        startAuctionTimer(timerEl.id, endTime);
                    });
                });

                function startAuctionTimer(timerId, endTime) {
                    const timerEl = document.getElementById(timerId);
                    if (!timerEl) return;

                    const interval = setInterval(() => {
                        const now = new Date().getTime();
                        const distance = endTime - now;

                        if (distance <= 0) {
                            timerEl.textContent = '판매완료';
                            clearInterval(interval);
                            return;
                        }

                        const hours = Math.floor((distance / (1000*60*60)) % 24);
                        const minutes = Math.floor((distance / (1000*60)) % 60);
                        const seconds = Math.floor((distance / 1000) % 60);

                        timerEl.textContent =
                            (hours<10?'0'+hours:hours) + ':' +
                            (minutes<10?'0'+minutes:minutes) + ':' +
                            (seconds<10?'0'+seconds:seconds);
                    }, 1000);
                }
            </script>

        </main>

    </div>
</div>
</body>
</html>
