<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <style>
        :root{
            --brand:#e6891e;
            --text:#333;
            --muted:#888;
            --line:#e8e8e8;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,Arial;
            background:#fff;
            color:var(--text);
        }
        .wrap{ max-width:1100px; margin:0 auto; padding:24px; }

        /* 레이아웃 */
        .layout{
            display:grid;
            grid-template-columns: 280px 1fr;
            gap:0;
            min-height:100vh;
        }

        /* 사이드바 */
        .sidebar{
            position:sticky; top:16px;
            align-self:start;
            padding:24px 20px 24px 0;
            border-right:1px solid var(--line);
        }
        .profile{
            display:flex; flex-direction:column; align-items:center; gap:10px;
            padding-bottom:13px; border-bottom:1px solid var(--line);
            text-align:center;
        }
        .profile-img{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
            border: 1px solid var(--line);
            background: #f0f0f0;
        }
        .nick{font-weight:700; padding-bottom:0px;}
        .email{font-size:12px; color:var(--muted);}

        .stats{
            padding:14px 0; border-bottom:1px solid var(--line);
            text-align:center; /* 가운데 정렬 */
        }
        .num{font-size:22px; font-weight:800; color:var(--brand);}
        .label{font-size:13px; color:var(--muted);}

        .menu{
            /* width: fit-content;*/

            margin: 14px auto 0;

            list-style:none;
            padding:30px 0 0 80px;
            display:flex;
            flex-direction:column;
            gap:30px;
        }
        .menu li::before{
            content:"• ";
            color:var(--muted);
            font-weight:600;
            margin-right:4px;
        }
        .menu a{
            display:inline-block;
            text-decoration:none;
            color:var(--text);
        }
        .menu a.active{ color:var(--brand); font-weight:700; }
        .menu a:hover{ }

        /* 본문 */
        .content{
            padding:24px 0 24px 24px;
        }
        .content h2{ margin:0 0 10px; }
        .sub{color:var(--muted); font-size:14px; margin-bottom:16px}

        /*상품 하이퍼 링크 밑줄 생기는거 없애기*/
        a.card {
            display: block;
            text-decoration: none; /* 밑줄 제거 */
            color: inherit;
        }

        /* 카드 그리드 */
        .grid{
            display:grid; grid-template-columns: repeat(3, 1fr);
            gap:16px;
        }
        .card{
            border:1px solid var(--line); border-radius:10px; background:#fff;
            overflow:hidden; display:flex; flex-direction:column;
        }
        .thumb{width:100%; aspect-ratio:1/1; object-fit:cover; background:#f3f3f3}
        .card-body{padding:12px}
        .title{font-weight:600; margin:0 0 6px}
        .meta{display:flex; justify-content:space-between; align-items:center; font-size:14px}
        .price{font-weight:700}
        .status{font-size:14px; padding:0 0 0 10px; color:var(--muted)}

        @media (max-width: 960px){
            .layout{ grid-template-columns: 1fr; }
            .sidebar{ position:static; border-right:none; border-bottom:1px solid var(--line); padding:16px 0; }
            .content{ padding:16px 0; }
            .grid{ grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px){
            .grid{ grid-template-columns: 1fr; }
        }
    </style>
    <!--상품 그리드 css-->
    <link rel="stylesheet" th:href="@{/css/mypage_product_grid.css}">
    <!--헤더 css-->
    <link rel="stylesheet" th:href="@{/css/header.css}">
<body>

<!-- 헤더 포함 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="wrap">
    <div class="layout">

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="profile">
                <img class="profile-img" th:src="${member.profileImageUrl} ?: @{/images/profile_temp.png}">
                <div class="nick" th:text="${member.memberNickname} ?: ${member.memberName}">닉네임</div>
                <div class="email" th:text="${member.memberEmail}">email</div>
            </div>
            <ul class="menu">
                <li><a th:href="@{/mypage}" th:classappend="${activeTab}=='sales' ? ' active'">판매리스트</a></li>
                <li><a th:href="@{/mypage/purchases}" th:classappend="${activeTab}=='purchases' ? ' active'">낙찰리스트</a></li>
                <li><a th:href="@{/mypage/bid}" th:classappend="${activeTab}=='bid' ? ' active'">입찰리스트</a></li>
                <li><a th:href="@{/mypage/wishlist}" th:classappend="${activeTab}=='wishlist' ? ' active'">위시리스트</a></li>
                <li><a th:href="@{/mypage/edit}" th:classappend="${activeTab}=='edit' ? ' active'">계정설정</a></li>
            </ul>
        </aside>

        <!-- 본문 -->
        <main class="content">
            <h2>판매리스트</h2>
            <div class="sub">내가 등록한 상품 리스트</div>
            <div class="grid-wrapper">

                <div class="grid" th:if="${sales != null}">
                    <!--해당 페이지로 이동-->
                    <a class="card" th:each="s : ${sales}"
                         th:href="@{/auction/auction_detail(productId=${s.productId})}">
                        <div class="thumb-wrapper">
                            <img class="thumb"
                                 th:src="${s.imageUrl} ?: @{/images/product_null.png}"
                                 alt="상품 이미지">

                        </div>

                        <div class="card-body">
                            <p class="title" th:text="${s.postName}">상품명</p>
                            <span class="price"
                                  th:text="${#numbers.formatInteger(s.currentPrice, 3, 'COMMA')} + '원'">0원</span>

                            <!-- 타이머 + 상태 한 줄 배치 -->
                            <div class="meta-timer">
                                <div class="timer"
                                     th:id="'timer-' + ${s.productId}"
                                     th:attr="data-end-time=${productEndTimes[s.productId]},
                                              data-days=${s.durationDays},
                                              data-hours=${s.durationHours},
                                              data-minutes=${s.durationMinutes}">0일:00:00:00</div>
                                <span class="status"
                                      th:text="${s.calculateEndTime() != null and s.calculateEndTime().isBefore(T(java.time.LocalDateTime).now()) ? '판매완료' : '판매중'}">
                                        상태
                                </span>
                            </div>
                        </div>
                    </a>

                </div>
                <div th:if="${sales == null or #lists.isEmpty(sales)}"
                     style="grid-column:1/-1; color:var(&#45;&#45;muted); text-align:center; padding:24px 0;">
                    아직 판매내역이 없습니다.
                </div>
            </div>


<!--            JS 파일 로드-->
            <script th:src="@{/js/wishlist.js}"></script>

            <!--타이머 기능 구현-->
            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    document.querySelectorAll('.timer').forEach(timerEl => {
                        const endTimeAttr = timerEl.dataset.endTime;
                        let endTimestamp = null;
                        if (endTimeAttr) {
                            const parsed = Date.parse(endTimeAttr);
                            if (!Number.isNaN(parsed)) {
                                endTimestamp = parsed;
                            }
                        }

                        if (!endTimestamp) {
                            const days = parseInt(timerEl.dataset.days || '0', 10);
                            const hours = parseInt(timerEl.dataset.hours || '0', 10);
                            const minutes = parseInt(timerEl.dataset.minutes || '0', 10);
                            const now = new Date().getTime();
                            const durationMs =
                                (days * 24 * 60 * 60 * 1000) +
                                (hours * 60 * 60 * 1000) +
                                (minutes * 60 * 1000);
                            endTimestamp = now + durationMs;
                        }

                        startAuctionTimer(timerEl.id, endTimestamp);
                    });
                });

                function startAuctionTimer(timerId, endTimestamp) {
                    const timerEl = document.getElementById(timerId);
                    if (!timerEl) return;

                    const interval = setInterval(() => {
                        const now = new Date().getTime();
                        const distance = endTimestamp - now;

                        if (distance <= 0) {
                            timerEl.textContent = '판매완료';
                            clearInterval(interval);
                            return;
                        }

                        const totalSeconds = Math.floor(distance / 1000);
                        const days = Math.floor(totalSeconds / 86400);
                        const hours = Math.floor((totalSeconds % 86400) / 3600);
                        const minutes = Math.floor((totalSeconds % 3600) / 60);
                        const seconds = totalSeconds % 60;

                        timerEl.textContent =
                            days + '일:' +
                            (hours < 10 ? '0' + hours : hours) + ':' +
                            (minutes < 10 ? '0' + minutes : minutes) + ':' +
                            (seconds < 10 ? '0' + seconds : seconds);
                    }, 1000);
                }
            </script>

        </main>

    </div>
</div>
</body>
</html>
