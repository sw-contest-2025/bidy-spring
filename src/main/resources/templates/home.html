<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
        .search-box{
        width:600px;
        height:30px;
        background: white;
        border-radius: 40px;
        padding:10px;
        border: 1px solid black;
    }

    .search-txt {
        border: none;
        background: none;
        outline: none;
        float: left;
        padding: Opx;
        color: #797979;
        font-size: 16px;
        line-height: 30px; width: 200px;
    }

    .search-btn{
        float: right;
        width: 40px; height: 100%;
        border-radius: 50%;
        background: white;
        border: none;
        font-size: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
        .searchDiv{
        margin: 0 auto;
        }
    </style>
</head>
<body>

<div id="searchDiv">
    <form class = "search-box" action="" method="get">
        <input class="search-txt" type="text" name="" placeholder="  검색어를 입력하세요">
        <button class="search-btn" type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form>
</div>

</body>
</html>
