<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈페이지</title>
    <!--    서치 픽토그램 참고링크-->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!--css파일-->
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<!-- 헤더 포함 -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- 메인 컨텐츠 -->
<div class="main-content">
    <div class="logo"></div>

    <p class="slogan">당신의 일상을 더 가치있게,</p>

    <!-- 검색창 -->
    <form th:action="@{/search}" method="get" class = "search-box">
        <input class="search-txt" type="text" name="keyword" th:value="${keyword}" placeholder="  검색어를 입력하세요">
        <button class="search-button" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form><br>

    <!-- 네비게이션 박스 -->
    <div class="nav-boxes">
        <a href="/" class="nav-box">
            <div class="nav-icon">🔅</div>
            <div>전체보기</div>
        </a>
        <a th:href="@{/(category='그림')}" class="nav-box">
            <div class="nav-icon">🎨</div>
            <div>그림</div>
        </a>
        <a th:href="@{/(category='공예')}" class="nav-box">
            <div class="nav-icon">🧶</div>
            <div>공예</div>
        </a>
        <a th:href="@{/(category='도서')}" class="nav-box">
            <div class="nav-icon">📖</div>
            <div>도서</div>
        </a>
        <a th:href="@{/(category='의류/잡화')}" class="nav-box">
            <div class="nav-icon">👗</div>
            <div>의류/잡화</div>
        </a>
        <a th:href="@{/(category='홈인테리어')}" class="nav-box">
            <div class="nav-icon">🪑</div>
            <div>홈인테리어</div>
        </a>
        <a th:href="@{/(category='문구류')}" class="nav-box">
            <div class="nav-icon">✏️</div>
            <div>문구류</div>
        </a>
        <a th:href="@{/(category='가전디지털')}" class="nav-box">
            <div class="nav-icon">💻</div>
            <div>가전디지털</div>
        </a>
        <a th:href="@{/(category='악기')}" class="nav-box">
            <div class="nav-icon">🎻</div>
            <div>악기</div>
        </a>
        <a th:href="@{/(category='기타')}" class="nav-box">
            <div class="nav-icon">🔨</div>
            <div>기타</div>
        </a>
    </div>
</div>
<!-- 메인 컨텐츠 끝-->

<!--하단 상품 설명, 상품이 추가되면 증가하도록-->
<div class="grid-wrapper">

    <div class="grid" th:if="${products != null}">
        <div class="card" th:each="s : ${products}"
             th:onclick="'location.href=\'/auction/auction_detail?productId=' + ${s.productId} + '\';'">
            <div class="thumb-wrapper">
                <img class="thumb"
                     th:src="${s.imageUrl != null} ? @{${s.imageUrl}} : @{/images/product_null.png}"
                     alt="상품 이미지">
                <!-- 찜 버튼 -->
                <button class="wishlist-btn" th:attr="data-product-id=${s.productId}">
                    <img th:src="${#lists.contains(wishlistProductIds != null ? wishlistProductIds : {}, s.productId)} ?
             @{/images/click_heart.png} :
             @{/images/heart.png}"
                         th:attr="data-state=${#lists.contains(wishlistProductIds != null ? wishlistProductIds : {}, s.productId)} ? 'on' : 'off'"
                         alt="찜" width="24" height="24">
                </button>
            </div>

            <div class="card-body">
                <p class="title" th:text="${s.postName}">상품명</p>
                <span class="price"
                      th:text="${#numbers.formatInteger(s.currentPrice, 3, 'COMMA')} + '원'">0원</span>

                <!-- 타이머 + 상태 한 줄 배치 -->
                <div class="meta-timer">
                    <div class="timer"
                         th:id="'timer-' + ${s.productId}"
                         th:attr="data-end-time=${productEndTimes?.get(s.productId) ?: ''}">00:00:00</div>
                    <span class="status"
                          th:text="${s.calculateEndTime() != null and s.calculateEndTime().isBefore(T(java.time.LocalDateTime).now()) ? '판매완료' : '판매중'}">
                        상태
                    </span>
                </div>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
    // 1. 위시리스트 상태 동기화 함수 (페이지 로드 시 호출될 함수)
    async function syncWishlistState(btn, productId) {
        const imgElement = btn.querySelector('img');
        if (!imgElement) return;

        try {
            const checkRes = await fetch(`/api/wishlist/check/${productId}`);

            if (checkRes.ok) {
                const checkData = await checkRes.json();

                if (checkData.isWishlisted) {
                    imgElement.src = '/images/click_heart.png'; // 꽉 찬 하트
                    imgElement.dataset.state = 'on';
                } else {
                    imgElement.src = '/images/heart.png'; // 빈 하트
                    imgElement.dataset.state = 'off';
                }
            }
        } catch (e) {
            console.error(`초기 위시리스트 상태 확인 실패 (ID: ${productId}):`, e);
        }
    }

    // 2. 타이머 시작 함수
     function startAuctionTimer(timerId, endTime) {
         const timerEl = document.getElementById(timerId);
         if (!timerEl) return; //(null 체크)

         const interval = setInterval(() => { //setInterval()은 1초마다 특정 코드를 반복 실행
             const now = new Date().getTime(); //지금 시간을 가져옴
             const distance = endTime - now; //distance 에 끝나는 시간 - 지금 시간을 계산

             if (distance <= 0) {
                 timerEl.textContent = '판매완료';
                 clearInterval(interval);
                 return;
             }
             const totalSeconds = Math.floor(distance / 1000);
             const days = Math.floor(totalSeconds / 86400);
             const hours = Math.floor((totalSeconds % 86400) / 3600);
             const minutes = Math.floor((totalSeconds % 3600) / 60);
             const seconds = totalSeconds % 60;
             timerEl.textContent =
                 days + '일:' +
                 (hours<10?'0'+hours:hours) + ':' +
                 (minutes<10?'0'+minutes:minutes) + ':' +
                 (seconds<10?'0'+seconds:seconds);
         }, 1000);
     }


    // 3. DOMContentLoaded 통합 (초기화 및 이벤트 리스너 설정)
    document.addEventListener('DOMContentLoaded', function() {

        // --- 3.1 타이머 초기화 ---
        document.querySelectorAll('.timer').forEach(timerEl => {
            const endTimeStr = timerEl.dataset.endTime;

            if (!endTimeStr) {
                timerEl.textContent = '판매완료';
                return;
            }

            const endTime = new Date(endTimeStr);
            if (isNaN(endTime.getTime())) {
                timerEl.textContent = '판매완료';
                return;
            }

            startAuctionTimer(timerEl.id, endTime.getTime());
        });

        // --- 3.2 위시리스트 초기화 및 클릭 리스너 ---
        document.querySelectorAll('.wishlist-btn').forEach(btn => {
            const productId = btn.dataset.productId;

            if (productId) {
                syncWishlistState(btn, productId);
            }

            // 클릭 리스너 설정
            btn.addEventListener('click', function(event) {
                event.stopPropagation(); // 경매 페이지 이동 방지

                const img = this.querySelector('img');
                const isWishlisted = img.dataset.state === 'on';

                let message;
                // UI 즉시 토글
                if (isWishlisted) {
                    img.src = '/images/heart.png';
                    img.dataset.state = 'off';
                    message = '삭제되었습니다.';
                } else {
                    img.src = '/images/click_heart.png';
                    img.dataset.state = 'on';
                    message = '추가되었습니다.';
                }

                fetch(`/api/wishlist/toggle/${productId}`, { method: 'POST' })
                .then(res => {
                    if (res.status === 401) {
                        alert('로그인이 필요합니다.');
                        window.location.href = '/login';

                        // 401 시, UI 상태를 클릭 전 상태로 되돌림
                        if (isWishlisted) {
                            img.src = '/images/click_heart.png';
                            img.dataset.state = 'on';
                        } else {
                            img.src = '/images/heart.png';
                            img.dataset.state = 'off';
                        }
                        throw new Error('Unauthorized');
                    }
                    return res.json();
                })
                .then(data => {
                    alert('위시리스트 ' + message );
                    console.log(data);
                })
                .catch(err => {
                    console.error(err);
                     // 통신 실패 시, UI를 클릭 전 상태로 되돌림
                    if (isWishlisted) {
                        img.src = '/images/click_heart.png';
                        img.dataset.state = 'on';
                    } else {
                        img.src = '/images/heart.png';
                        img.dataset.state = 'off';
                    }
                });
            });
        });
    });

    // 4. 검색 처리 함수 (기존 코드 유지)
    function handleSearch(event) {
        event.preventDefault();
        const searchTerm = document.getElementById('searchInput').value;
        if (searchTerm.trim()) {
            alert(`검색어: ${searchTerm}`);
            // window.location.href = `search.html?q=${encodeURIComponent(searchTerm)}`;
        }
    }
</script>
</body>
</html>
