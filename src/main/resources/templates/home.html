                         th:data-hours="${s.durationHours}"
                         th:data-minutes="${s.durationMinutes}">00:00:00</div>
                    <span class="status"
                          th:text="${s.calculateEndTime() != null and s.calculateEndTime().isBefore(T(java.time.LocalDateTime).now()) ? '판매완료' : '판매중'}">

<!--타이머 기능 구현-->
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
     document.querySelectorAll('.timer').forEach(timerEl => {
         const days = parseInt(timerEl.dataset.days);
         const hours = parseInt(timerEl.dataset.hours);
         const minutes = parseInt(timerEl.dataset.minutes);

         const now = new Date().getTime();
         const durationMs = (days*24*60*60*1000) + (hours*60*60*1000) + (minutes*60*1000);
         const endTime = now + durationMs;

         startAuctionTimer(timerEl.id, endTime);
     });
 });

 function startAuctionTimer(timerId, endTime) {
     const timerEl = document.getElementById(timerId);
     if (!timerEl) return;

     const interval = setInterval(() => {
         const now = new Date().getTime();
         const distance = endTime - now;

         if (distance <= 0) {
             timerEl.textContent = '판매완료';
             clearInterval(interval);
             return;
         }

         const hours = Math.floor((distance / (1000*60*60)) % 24);
         const minutes = Math.floor((distance / (1000*60)) % 60);
         const seconds = Math.floor((distance / 1000) % 60);

         timerEl.textContent =
             (hours<10?'0'+hours:hours) + ':' +
             (minutes<10?'0'+minutes:minutes) + ':' +
             (seconds<10?'0'+seconds:seconds);
     }, 1000);
 }

</script>

<!--하트 버튼 누르면 이미지 바꾸는 기능-->
<script>
document.querySelectorAll('.wishlist-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const productId = this.dataset.productId;
        const img = this.querySelector('img');

        // 현재 상태 확인
        const isWishlisted = img.dataset.state === 'on';

        let message;
        // 상태 토글
        if (isWishlisted) {
            img.src = '/images/heart.png';
            img.dataset.state = 'off';
            message = '삭제되었습니다.';
        } else {
            img.src = '/images/click_heart.png';  // 클릭 후 이미지
            img.dataset.state = 'on';
            message = '추가되었습니다.';
        }

        alert('위시리스트 ' + message );
        // 서버 전송에 로그인과 찜 여부 전송
        fetch(`/wishlist/toggle/${productId}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => console.log(data));
    });
});
</script>

<!--마이페이지 드롭다운-->
<script>
    const mypageIcon = document.querySelector('.mypage-icon');
    const dropdownMenu = document.querySelector('.dropdown-menu');

    mypageIcon.addEventListener('click', function(e) { // 드롭다운 토글
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    });

    // 드롭다운 밖 클릭 시 닫기
    document.addEventListener('click', function(e) {
        if (!mypageIcon.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.style.display = 'none';
        }
    });
</script>
