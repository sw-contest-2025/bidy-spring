<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 성공</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe668 0%, #e6891e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 70px;
            height: auto;
        }

        h2 {
            color: #333;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .home-btn {
            display: inline-block;
            background: linear-gradient(135deg, #fdd855 0%, #e6891e 100%);
            color: white;
            padding: 14px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(129, 57, 4, 0.4);
        }

        .home-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
<div class="success-container">

    <div class="logo-container">
        <img th:src="@{/images/bidy_logo.png}" alt="로고" class="logo-img">
    </div>

    <h2><span th:text="${memberNickname}"></span>님, 반가워요!</h2>

    <p>지금 바로 BIDY에서 즐거운 경매 시작해볼까요?</p>

    <a th:href="@{/}" class="home-btn">BIDY와 함께하러 가기 →</a>

</div>
</body>
</html>
