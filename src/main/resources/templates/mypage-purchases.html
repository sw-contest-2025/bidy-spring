<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <style>
        :root{
            --brand:#e6891e;
            --text:#333;
            --muted:#888;
            --line:#e8e8e8;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,Arial;
            background:#fff;
            color:var(--text);
        }
        .wrap{ max-width:1100px; margin:0 auto; padding:24px; }

        /* 레이아웃 */
        .layout{
            display:grid;
            grid-template-columns: 280px 1fr;
            gap:0;
            min-height:100vh;
        }

        /* 사이드바 */
        .sidebar{
            position:sticky; top:16px;
            align-self:start;
            padding:24px 20px 24px 0;
            border-right:1px solid var(--line);
        }
        .profile{
            display:flex; flex-direction:column; align-items:center; gap:10px;
            padding-bottom:13px; border-bottom:1px solid var(--line);
            text-align:center;
        }
        .profile-img{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
            border: 1px solid var(--line);
            background: #f0f0f0;
        }
        .nick{font-weight:700; padding-bottom:0px;}
        .email{font-size:12px; color:var(--muted);}

        .stats{
            padding:14px 0; border-bottom:1px solid var(--line);
            text-align:center; /* 가운데 정렬 */
        }
        .num{font-size:22px; font-weight:800; color:var(--brand);}
        .label{font-size:13px; color:var(--muted);}

        .menu{
            /* width: fit-content;*/

            margin: 14px auto 0;

            list-style:none;
            padding:30px 0 0 80px;
            display:flex;
            flex-direction:column;
            gap:30px;
        }
        .menu li::before{
            content:"• ";
            color:var(--muted);
            font-weight:600;
            margin-right:4px;
        }
        .menu a{
            display:inline-block;
            text-decoration:none;
            color:var(--text);
        }
        .menu a.active{ color:var(--brand); font-weight:700; }
        .menu a:hover{ }

        /* 본문 */
        .content{
            padding:24px 0 24px 24px;
        }
        .content h2{ margin:0 0 10px; }
        .sub{color:var(--muted); font-size:14px; margin-bottom:16px}

        /* 카드 그리드 */
        .grid{
            display:grid; grid-template-columns: repeat(3, 1fr);
            gap:16px;
        }
        .card{
            border:1px solid var(--line); border-radius:10px; background:#fff;
            overflow:hidden; display:flex; flex-direction:column;
        }
        .thumb{width:100%; aspect-ratio:1/1; object-fit:cover; background:#f3f3f3}
        .card-body{padding:12px}
        .title{font-weight:600; margin:0 0 6px}
        .meta{display:flex; justify-content:space-between; align-items:center; font-size:14px}
        .price{font-weight:700}
        .status{font-size:14px; padding:0 0 0 10px; color:var(--muted)}

        @media (max-width: 960px){
            .layout{ grid-template-columns: 1fr; }
            .sidebar{ position:static; border-right:none; border-bottom:1px solid var(--line); padding:16px 0; }
            .content{ padding:16px 0; }
            .grid{ grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px){
            .grid{ grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="layout">

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="profile">
                <img class="profile-img" th:src="${member.profileImageUrl} ?: @{/images/profile_temp.png}">
                <div class="nick" th:text="${member.memberNickname} ?: ${member.memberName}">닉네임</div>
                <div class="email" th:text="${member.memberEmail}">email</div>
            </div>

            <div class="stats">
                <div class="num" th:text="${tradeCount}">0</div>
                <div class="label">거래횟수</div>
            </div>
            <ul class="menu">
                <li><a th:href="@{/mypage}" th:classappend="${activeTab}=='sales' ? ' active'">판매내역</a></li>
                <li><a th:href="@{/mypage/purchases}" th:classappend="${activeTab}=='purchases' ? ' active'">구매내역</a></li>
                <li><a th:href="@{/mypage/wishlist}" th:classappend="${activeTab}=='wishlist' ? ' active'">관심목록</a></li>
                <li><a th:href="@{/mypage/settings}" th:classappend="${activeTab}=='settings' ? ' active'">계정설정</a></li>
            </ul>
        </aside>

        <!-- 본문 -->
        <main class="content">
            <h2>구매내역</h2>
            <div class="sub">내가 구매한 상품 리스트</div>

            <div class="grid">
                <div class="card" th:each="s : ${sales}">
                    <img class="thumb" th:src="${s.imageUrl} ?: @{/images/product_null.png}">
                    <div class="card-body">
                        <p class="title" th:text="${s.title} ?: ${s.name}">상품명</p>
                        <div class="meta">
                            <span class="price" th:text="${#numbers.formatInteger(s.price, 3, 'COMMA')} + '원'">0원</span>
                            <span class="status" th:text="${s.status} ?: '판매중'">판매중</span>
                        </div>
                    </div>
                </div>

                <div th:if="${sales == null or #lists.isEmpty(sales)}" style="grid-column:1/-1; color:var(&#45;&#45;muted);">
                    아직 구매내역이 없습니다.
                </div>
            </div>
        </main>

    </div>
</div>
</body>
</html>
