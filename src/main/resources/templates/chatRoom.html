<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ddd;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background-color: #e3f2fd;
        }
        .my-message {
            background-color: #fff9c4;
            text-align: right;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #msgInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
<h1>채팅 테스트</h1>

<div id="status" class="status disconnected">연결 중...</div>

<div>
    <strong>방 번호:</strong> <span th:text="${roomId}">1</span><br>
    <strong>사용자 ID:</strong> <span th:text="${userId}">1</span>
</div>

<hr>

<div id="messages"></div>

<div class="input-container">
    <input type="text"
           id="msgInput"
           placeholder="메시지를 입력하세요..."
           onkeypress="if(event.keyCode==13) sendMessage()">
    <button onclick="sendMessage()">보내기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    // Thymeleaf에서 변수 가져오기
    const roomId = /*[[${roomId}]]*/ 1;
    const userId = /*[[${userId}]]*/ 1;

    let stompClient = null;

    // WebSocket 연결
    function connect() {
        const socket = new SockJS('/websocket');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);
            updateStatus(true);

            // 채팅방 구독
            stompClient.subscribe('/topic/room/' + roomId, function(message) {
                console.log('메시지 수신:', message.body);
                showMessage(JSON.parse(message.body));
            });
        }, function(error) {
            console.error('Connection error:', error);
            updateStatus(false);
            // 5초 후 재연결 시도
            setTimeout(connect, 5000);
        });
    }

    // 연결 상태 표시
    function updateStatus(connected) {
        const statusDiv = document.getElementById('status');
        if (connected) {
            statusDiv.textContent = '✓ 연결됨';
            statusDiv.className = 'status connected';
        } else {
            statusDiv.textContent = '✗ 연결 끊김';
            statusDiv.className = 'status disconnected';
        }
    }

    // 메시지 전송
    function sendMessage() {
        const input = document.getElementById('msgInput');
        const messageContent = input.value.trim();

        if (messageContent && stompClient && stompClient.connected) {
            const message = {
                roomId: roomId,
                senderId: userId,
                message: messageContent,
                messageType: 'TEXT'
            };

            console.log('메시지 전송:', message);

            // 서버로 메시지 전송
            stompClient.send(
                "/app/test/chat/" + roomId,
                {},
                JSON.stringify(message)
            );

            input.value = '';
        } else if (!stompClient || !stompClient.connected) {
            alert('WebSocket이 연결되지 않았습니다.');
        }
    }

    // 메시지 화면에 표시
    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');

        // 내가 보낸 메시지인지 확인
        const isMyMessage = message.senderId == userId;
        messageElement.className = 'message' + (isMyMessage ? ' my-message' : '');

        // 메시지 내용 구성
        const time = new Date().toLocaleTimeString('ko-KR', {
            hour: '2-digit',
            minute: '2-digit'
        });

        messageElement.innerHTML = `
                <div>
                    <strong>사용자 ${message.senderId}</strong>
                    <small style="color: #666; margin-left: 10px;">${time}</small>
                </div>
                <div style="margin-top: 5px;">${escapeHtml(message.message)}</div>
            `;

        messagesDiv.appendChild(messageElement);

        // 스크롤을 맨 아래로
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // XSS 방지
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 페이지 로드 시 연결
    window.onload = function() {
        connect();
    };

    // 페이지 닫을 때 연결 해제
    window.onbeforeunload = function() {
        if (stompClient != null) {
            stompClient.disconnect();
        }
    };
</script>
</body>
</html>
