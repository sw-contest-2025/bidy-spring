<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe668 0%, #e6891e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-img {
            max-width: 70px;
            height: auto;
            display: inline-block;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .email-box {
            background-color: #fdf8e9;
            border: 1px solid #ffe082;
            color: #333;
            font-weight: bold;
            font-size: 17px;
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            width: 80%;
            text-align: center;
        }

        .no-result {
            font-size: 16px;
            color: #888;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #fdd855 0%, #e6891e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            padding: 12px 25px;
            margin-top: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(129, 57, 4, 0.4);
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .links a {
            color: #bd6b0e;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="result-container">

    <div class="logo-container">
        <img th:src="@{/images/bidy_logo.png}" alt="로고" class="logo-img">
    </div>
    <h2>이메일 찾기</h2>
    <div class="result" th:if="${count != null}">
        <div th:if="${count == 0}" class="no-result">
            가입된 정보가 없습니다.
        </div>
        <div th:if="${count > 0}">
            <p style="color:#555; margin-bottom:15px;">가입된 이메일 계정</p>
            <div th:each="r : ${results}" class="email-box" th:text="${r}"></div>
        </div>
    </div>

    <a th:href="@{/login}" class="btn">로그인 하러 가기</a>

    <div class="links">
        <a th:href="@{/find-email}">이메일(ID) 찾기</a>
        <a th:href="@{/signup}">회원가입</a>
        <a th:href="@{/find-password}">비밀번호 찾기</a>
    </div>
</div>
</body>
</html>
