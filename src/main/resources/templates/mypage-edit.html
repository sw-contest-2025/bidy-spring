<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <style>
        :root{
            --brand:#e6891e;
            --text:#333;
            --muted:#888;
            --line:#e8e8e8;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,Arial;
            background:#fff;
            color:var(--text);
        }
        .wrap{ max-width:1100px; margin:0 auto; padding:24px; }

        /* 레이아웃 */
        .layout{
            display:grid;
            grid-template-columns: 280px 1fr;
            gap:0;
            min-height:100vh;
        }

        /* 사이드바 */
        .sidebar{
            position:sticky; top:16px;
            align-self:start;
            padding:24px 20px 24px 0;
            border-right:1px solid var(--line);
        }
        .profile{
            display:flex; flex-direction:column; align-items:center; gap:10px;
            padding-bottom:13px; border-bottom:1px solid var(--line);
            text-align:center;
        }
        .profile-img{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
            border: 1px solid var(--line);
            background: #f0f0f0;
        }
        .nick{font-weight:700; padding-bottom:0;}
        .email{font-size:12px; color:var(--muted);}

        .stats{
            padding:14px 0; border-bottom:1px solid var(--line);
            text-align:center; /* 가운데 정렬 */
        }
        .num{font-size:22px; font-weight:800; color:var(--brand);}
        .label{font-size:13px; color:var(--muted);}

        .menu{
            /* width: fit-content;*/

            margin: 14px auto 0;

            list-style:none;
            padding:30px 0 0 80px;
            display:flex;
            flex-direction:column;
            gap:30px;
        }
        .menu li::before{
            content:"• ";
            color:var(--muted);
            font-weight:600;
            margin-right:4px;
        }
        .menu a{
            display:inline-block;
            text-decoration:none;
            color:var(--text);
        }
        .menu a.active{ color:var(--brand); font-weight:700; }
        .menu a:hover{ }

        /* 본문 */
        .content{
            padding:24px 0 24px 24px;
        }
        .content h2{ margin:0 0 10px; }
        .sub{color:var(--muted); font-size:14px; margin-bottom:16px}

        @media (max-width: 960px){
            .layout{ grid-template-columns: 1fr; }
            .sidebar{ position:static; border-right:none; border-bottom:1px solid var(--line); padding:16px 0; }
            .content{ padding:16px 0; }
        }

        /*수정 폼*/
        .edit-form{ max-width: 500px; margin-top: 20px;}
        .form-group{ margin-bottom: 20px; }
        .form-group label{ display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="date"],
        .form-group input[type="email"]{
            width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 4px;
        }
        .form-group input[readonly]{ background-color: #f7f7f7; color: var(--muted); cursor: not-allowed; }
        .error-message{ color: #d9534f; font-size: 13px; margin-top: 5px; display: block; }
        .btn-submit{
            background-color: var(--brand); color: #fff; padding: 12px 20px; border: none;
            border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-submit:hover{ background-color: #cc781a; }
        .success-message{ color: #5cb85c; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #eaffea; border-radius: 4px; }
    </style>
    </style>
</head>
<body>
<div class="wrap">
    <div class="layout">

        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="profile">
                <img class="profile-img" th:src="${member.profileImageUrl} ?: @{/images/profile_temp.png}">
                <div class="nick" th:text="${member.memberNickname} ?: ${member.memberName}">닉네임</div>
                <div class="email" th:text="${member.memberEmail}">email</div>
            </div>

            <div class="stats">
                <div class="num" th:text="${tradeCount}">0</div>
                <div class="label">거래횟수</div>
            </div>
            <ul class="menu">
                <li><a th:href="@{/mypage}" th:classappend="${activeTab}=='sales' ? ' active'">판매내역</a></li>
                <li><a th:href="@{/mypage/purchases}" th:classappend="${activeTab}=='purchases' ? ' active'">구매내역</a></li>
                <li><a th:href="@{/mypage/wishlist}" th:classappend="${activeTab}=='wishlist' ? ' active'">관심목록</a></li>
                <li><a th:href="@{/mypage/edit}" th:classappend="${activeTab}=='edit' ? ' active'">계정설정</a></li>
            </ul>
        </aside>

        <!-- 본문 -->
        <main class="content">
            <h2>계정설정</h2>
            <div class="sub">내 정보 수정</div>

            <div th:if="${param.success}" class="success-message">
                회원 정보가 성공적으로 수정되었습니다.
            </div>

            <form th:action="@{/mypage/edit}" th:object="${updateDto}" method="post" class="edit-form">

                <div class="form-group">
                    <label>프로필 이미지</label>
                    <input type="hidden" th:field="*{profileImageUrl}" />
                    <img th:src="${member.profileImageUrl} ?: @{/images/profile_temp.png}"
                         style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
                </div>

                <div class="form-group">
                    <label for="memberEmail">이메일(ID)</label>
                    <input type="email" id="memberEmail" th:value="${member.memberEmail}" readonly>
                </div>

                <div class="form-group">
                    <label for="memberNickname">닉네임</label>
                    <input type="text" id="memberNickname" th:field="*{memberNickname}" placeholder="닉네임을 입력하세요">
                    <p th:errors="*{memberNickname}" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="memberName">이름</label>
                    <input type="text" id="memberName" th:value="${member.memberName}" readonly>
                </div>

                <div class="form-group">
                    <label for="memberBirthday">생년월일</label>
                    <input type="text" id="memberBirthday" th:value="${member.memberBirthday}" readonly>
                </div>

                <hr style="margin: 30px 0; border-color: var(--line);">

                <h3>비밀번호 변경</h3>
                <!--현재 비밀번호 입력-->
                <div class="form-group">
                    <label for="currentPassword">현재 비밀번호</label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}" placeholder="정보 수정을 위해 현재 비밀번호를 입력해주세요">
                    <p th:errors="*{currentPassword}" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" placeholder="변경할 새 비밀번호">
                </div>

                <div class="form-group">
                    <label for="newPasswordConfirm">새 비밀번호 확인</label>
                    <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" placeholder="새 비밀번호 다시 입력">
                    <p th:errors="*{newPasswordConfirm}" class="error-message"></p>
                </div>

                <hr style="margin: 30px 0; border-color: var(--line);">

                <button type="submit" class="btn-submit">정보 수정</button>

            </form>
        </main>

    </div>
</div>
</body>
</html>
