<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe668 0%, #e6891e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo-container img {
            max-width: 60px;
            height: auto;
            display: inline-block;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        p.desc {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #e67c25;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .alert-success {
            background-color: #eff9ee;
            color: #1e7c45;
            border: 1px solid #d6f0d9;
        }

        .alert-danger {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fdd855 0%, #e6891e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(129, 57, 4, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .links {
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            margin-top: 20px;
        }

        .links a {
            flex: 1;
            text-align: center;
            color: #bd6b0e;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo-container">
        <img th:src="@{/images/bidy_logo.png}" alt="로고">
    </div>
    <h2>비밀번호 재설정</h2>
    <p class="desc">가입하신 이메일을 입력하면 임시 비밀번호를<br>해당 메일로 전송해드립니다.</p>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/find-password}" th:object="${req}" method="post">
        <div class="form-group">
            <label for="memberEmail">이메일</label>
            <input type="email" id="memberEmail" th:field="*{memberEmail}" placeholder="이메일 주소 입력">
            <div class="error-message" th:if="${#fields.hasErrors('memberEmail')}" th:errors="*{memberEmail}"></div>
        </div>
        <button type="submit" class="btn">비밀번호 재설정</button>
    </form>

    <div class="links">
        <a th:href="@{/find-email}">이메일(ID) 찾기</a>
        <a th:href="@{/signup}">회원가입</a>
        <a th:href="@{/login}">로그인</a>
    </div>
</div>
</body>
</html>
