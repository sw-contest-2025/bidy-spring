<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
    <style>
        body {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .chat-room-item {
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 30px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        h3, p {
            margin: 0;
            margin-bottom: 10px;
        }
        a {
            text-decoration-line: none;
            color: black;
        }
    </style>
</head>
<body>
    <div th:each="room : ${rooms}" class="chat-room-item">
        <a th:href="@{/chat/room/{roomId}(roomId=${room.id})}">
            <h3 th:text="${room.productPostName}"></h3>
            <p class="last-message" th:text="${room.lastMessage}"></p>
            <small th:text="${#temporals.format(room.lastMessageTime, 'yyyy-MM-dd HH:mm')}"/></small>
        </a>
    </div>
</body>
</html>
