<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title>
    <style>
        body {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #chat-container {
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background-color: #e3f2fd;
        }
        .my-message {
            width: 100px;
            background-color: #fff9c4;
            text-align: right;
            align-self: flex-end;
            margin-left: auto;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #fedf54;
            color: #494949;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(231, 109, 11);
        }
    </style>
</head>
<body>
    <h2 th:text="${room.getProductPostName()}"></h2>

    <!-- 이전 메시지 내역 -->
    <div id="chat-container">
        <div th:each="msg : ${messages}"
             th:classappend="${msg.senderId} == ${buyerId} ? 'my-message' : 'other-message'">
            <span th:text="${msg.sender.memberNickname}"></span>
            <p th:text="${msg.message}"></p>
            <small th:text="${#temporals.format(msg.createdAt, 'HH:mm')}"></small>
        </div>
    </div>

    <!-- 메시지 입력 창 -->
    <div class="input-container">
        <input type="text" id="message-input" />
        <button onclick="sendMessage()">전송</button>
    </div>


    <!-- WebSocket 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:inline="javascript">
        const roomId = /*[[${room.id}]]*/ 1;
        const buyerId = /*[[${buyerId}]]*/ 2;

        // WebSocket 연결
        let stompClient = null;

        function connect() {
            // 1. SockJS로 WebSocket 연결 생성
            const socket = new SockJS('/websocket');

            // 2. STOMP 클라이언트 생성
            stompClient = Stomp.over(socket);

            // 3. 서버에 연결
            stompClient.connect({}, function(frame) {
                console.log('WebSocket 연결됨: ' + frame);

                // 4. 채팅방 토픽 구독 (이 채팅방의 메시지만 받음)
                stompClient.subscribe('/topic/public/' + roomId, function(message) {
                    // 5. 새 메시지를 받으면 화면에 표시
                    showMessage(JSON.parse(message.body));
                });
            });
        }

        function sendMessage() {
            const messageContent = document.getElementById('message-input').value;

            if(messageContent && stompClient) {
                const chatMessage = {
                    roomId: roomId,
                    senderId: buyerId,
                    message: messageContent,
                    messageType: 'TEXT'
                };

                stompClient.send("/app/chat/"+roomId, {}, JSON.stringify(chatMessage));
                document.getElementById('message-input').value='';
            }
        }

        function showMessage(message) {
            const chatArea = document.getElementById('chat-container');
            const messageElemnet = document.createElement('div');

            const isMyMessage  = message.senderId === buyerId;
            messageElemnet.className = 'message' + (isMyMessage ? ' my-message' : '');
            // messageElemnet.classList.add('message');
            // messageElemnet.classList.add(isMine ? 'my-message' : 'other-message');

            const time = new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });

            messageElemnet.innerHTML = `
                <div>
                    <strong>${message.senderName}</strong>
                    <span style="font-size:0.8em;color:#666;margin-left:5px;">${time}</span>
                </div>
                <div>${message.message}</div>
            `;

            chatArea.appendChild(messageElemnet);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 연결
        connect();
    </script>
</body>
</html>
