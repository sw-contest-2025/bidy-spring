<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .chat-wrapper {
            margin: 50px auto;
            max-width: 700px;
        }
        #chat-container {
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            max-width: 70%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            background-color: #e3f2fd;
            word-wrap: break-word;
            border: 1px solid #ddd;
        }
        .msg-upper {
            span {
                font-size: 0.8em;
                color: #666;
                margin-left: 5px;
            }
        }
        .my-message {
            background-color: #fff9c4;
            text-align: right;
            align-self: flex-end;
            margin-left: auto;
        }
        .other-message {
            align-self: flex-start;
            margin-right: auto;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #fedf54;
            color: #494949;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #fff9c4;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>

<!-- 헤더 포함 -->
<div th:replace="~{fragments/header :: header}"></div>

    <div class="chat-wrapper">
        <h2 th:text="${room.productPostName}"></h2>
        <div>판매자: <span th:text="${room.sellerName}"></span></div>

        <!-- 이전 메시지 내역 -->
        <div id="chat-container">
            <div th:each="msg : ${messages}"
                 class="message"
                 th:classappend="${msg.senderId == loginId} ? 'my-message' : 'other-message'">
                <div class="msg-upper">
                    <strong th:text="${msg.senderName}"></strong>
                    <span th:text="${#temporals.format(msg.createdAt, 'HH:mm')}"></span>
                </div>
                <div class="msg-down" th:text="${msg.message}"></div>
            </div>
        </div>

        <!-- 메시지 입력 창 -->
        <div class="input-container">
            <input type="text" id="message-input" />
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>



    <!-- WebSocket 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:inline="javascript">
        const roomId = /*[[${room.id}]]*/ 1;
        const loginId = /*[[${loginId}]]*/ 2;

        // WebSocket 연결
        let stompClient = null;

        function connect() {
            // 1. SockJS로 WebSocket 연결 생성
            const socket = new SockJS('/websocket');

            // 2. STOMP 클라이언트 생성
            stompClient = Stomp.over(socket);

            // 3. 서버에 연결
            stompClient.connect({}, function(frame) {
                console.log('WebSocket 연결됨: ' + frame);

                // 4. 채팅방 토픽 구독 (이 채팅방의 메시지만 받음)
                stompClient.subscribe('/topic/public/' + roomId, function(message) {
                    // 5. 새 메시지를 받으면 화면에 표시
                    showMessage(JSON.parse(message.body));
                });
            });
        }

        function sendMessage() {
            const messageContent = document.getElementById('message-input').value.trim();

            if(messageContent && stompClient) {
                const chatMessage = {
                    roomId: roomId,
                    senderId: loginId,
                    message: messageContent,
                    messageType: 'TEXT'
                };

                stompClient.send("/app/chat/"+roomId, {}, JSON.stringify(chatMessage));
                document.getElementById('message-input').value='';
            }
        }

        function showMessage(message) {
            const chatArea = document.getElementById('chat-container');
            const messageElement = document.createElement('div');

            const isMyMessage  = message.senderId === loginId;
            messageElement.className = isMyMessage ? 'message my-message' : 'message other-message';

            const time = new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });

            messageElement.innerHTML = `
                <div>
                    <strong>${message.senderName}</strong>
                    <span style="font-size:0.8em;color:#666;margin-left:5px;">${time}</span>
                </div>
                <div>${message.message}</div>
            `;

            chatArea.appendChild(messageElement);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Enter 키로 전송
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 연결
        connect();
    </script>
</body>
</html>
